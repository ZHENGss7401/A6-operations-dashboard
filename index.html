<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6月运营看板 · A区</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000b19;color:#ebebeb;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;padding:32px}
.header{margin-bottom:36px}
.header h1{font-size:20px;font-weight:600;color:#fff;letter-spacing:.5px}
.header .sub{color:#5a7a8a;font-size:12px;margin-top:4px}
.section{margin-bottom:40px}
.section-title{font-size:15px;font-weight:600;color:#c8d0d8;margin-bottom:16px;padding-left:12px;border-left:3px solid}
.section-title.video{border-color:#4fc3f7}
.section-title.graphic{border-color:#ffb74d}
.stats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:#1a2538;border-radius:10px;padding:14px 18px;min-width:120px;flex:1}
.stat .l{color:#5a7a8a;font-size:11px;margin-bottom:2px}
.stat .v{font-size:22px;font-weight:700;color:#fff}
.stat .s{color:#3a5a6a;font-size:10px;margin-top:2px}
.row{display:grid;gap:12px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.card{background:#1a2538;border-radius:12px;padding:18px}
.card .h{font-size:12px;color:#8899aa;margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:6px}
.card .h .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.chart-w{position:relative;height:200px}
.chart-w.t{height:260px}
.rlist{display:flex;flex-direction:column;gap:5px}
.ritem{display:flex;align-items:center;padding:8px 10px;background:#0f1a2a;border-radius:8px;gap:8px}
.ritem .rn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#2a3a50;color:#8899aa;flex-shrink:0}
.ritem .rn.gold{background:#c8a830;color:#fff}
.ritem .rn.silver{background:#7088a0;color:#fff}
.ritem .rn.bronze{background:#b87048;color:#fff}
.ritem .av{width:26px;height:26px;border-radius:50%;background:#2a3a50;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8899aa;flex-shrink:0;font-weight:600}
.ritem .nm{flex:1;font-size:13px;color:#d0d8e0}
.ritem .vl{font-size:13px;font-weight:600;color:#4fc3f7}
.ritem .vl2{font-size:11px;color:#5a7a8a;text-align:right;min-width:50px}
@media(max-width:768px){.c2{grid-template-columns:1fr}body{padding:16px}}
</style>
</head>
<body>

<div class="header">
<h1>6月份运营累计播放量看板</h1>
<div class="sub">6月1日 - 6月11日 ｜ A 区</div>
</div>

<div id="app"></div>

<script>
var D = {"digital": {"label": "数字人视频", "persons": [["庄惜婷", {"play": 8.7, "pub": 305, "over5k": 3, "opct": 0.98, "us": 95.73}], ["王春燕", {"play": 4.1, "pub": 735, "over5k": 2, "opct": 0.27, "us": 96.1}]], "writers": [["刘信良", {"play": 12.2, "pub": 604, "over5k": 4, "opct": 0.66}], ["何嘉玲", {"play": 0.6, "pub": 425, "over5k": 1, "opct": 0.24}], ["林秋利", {"play": 0, "pub": 11, "over5k": 0, "opct": 0.0}]], "total_play": 12.8, "total_pub": 1040, "total_over5k": 5}, "graphic": {"label": "测评图文", "persons": [["吴丽贞", {"play": 26.4, "pub": 1596, "over5k": 20, "opct": 1.25, "us": 70.05}], ["蔡晓雪", {"play": 6.6, "pub": 1452, "over5k": 9, "opct": 0.62, "us": 37.13}], ["庄惜婷", {"play": 0.5, "pub": 904, "over5k": 1, "opct": 0.11, "us": 5.8}]], "writers": [["桂环", {"play": 33.5, "pub": 3952, "over5k": 30, "opct": 0.76}]], "total_play": 33.5, "total_pub": 3952, "total_over5k": 30}};
var COL = ['#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#4db6ac','#f06292','#a1887f'];

function barChart(el, items, key, label) {
  var sorted = items.slice().sort(function(a,b){return b[1][key]-a[1][key]});
  new Chart(el, {
    type: 'bar',
    data: {labels: sorted.map(function(x){return x[0]}), datasets: [{data: sorted.map(function(x){return x[1][key]}), label: label, backgroundColor: COL, borderRadius: 4, barPercentage: 0.6}]},
    options: {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5a7a8a',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#5a7a8a',font:{size:11}},grid:{color:'#0f1a2a'}}}}
  });
}

function rankList(el, items, fields) {
  var h = '';
  for(var i=0;i<items.length;i++) {
    var rc = 'rn' + (i===0?' gold':i===1?' silver':i===2?' bronze':'');
    h += '<div class="ritem"><div class="'+rc+'">'+(i+1)+'</div><div class="av">'+items[i][0].charAt(0)+'</div><div class="nm">'+items[i][0]+'</div>';
    for(var f=0;f<fields.length;f++) {
      var v = fields[f].fmt ? fields[f].fmt(items[i][1]) : items[i][1][fields[f].k];
      h += '<div class="'+(f===0?'vl':'vl2')+'">'+v+'</div>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

function buildSection(sec, color, containerId) {
  var app = document.getElementById(containerId);
  var ps = sec.persons, ws = sec.writers;
  var tp=sec.total_play, tpub=sec.total_pub, tov=sec.total_over5k;
  var tpc = tpub>0?(tov/tpub*100).toFixed(2):'0.00';

  // Title
  var st = document.createElement('div');
  st.className = 'section-title ' + (color==='#4fc3f7'?'video':'graphic');
  st.textContent = sec.label;
  app.appendChild(st);

  // Stats
  var sr = document.createElement('div');
  sr.className = 'stats';
  sr.innerHTML = '<div class="stat"><div class="l">播放量</div><div class="v">'+tp.toFixed(2)+'W</div><div class="s">月累计</div></div><div class="stat"><div class="l">发布条数</div><div class="v">'+tpub.toLocaleString()+'</div><div class="s">破0起计</div></div><div class="stat"><div class="l">上5K</div><div class="v">'+tov+'条</div><div class="s">爆款量</div></div><div class="stat"><div class="l">上5K占比</div><div class="v">'+tpc+'%</div><div class="s">爆款率</div></div><div class="stat"><div class="l">运营</div><div class="v">'+ps.length+'人</div><div class="s"></div></div>';
  app.appendChild(sr);

  // Charts row
  var r1 = document.createElement('div'); r1.className = 'row c2';

  var c1 = document.createElement('div'); c1.className = 'card';
  c1.innerHTML = '<div class="h"><span class="dot" style="background:'+color+'"></span>运营 · 播放量对比</div><div class="chart-w t"><canvas></canvas></div>';
  r1.appendChild(c1);
  barChart(c1.querySelector('canvas'), ps, 'play', '播放量（W）');

  var c2 = document.createElement('div'); c2.className = 'card';
  c2.innerHTML = '<div class="h"><span class="dot" style="background:'+color+'"></span>运营 · 排行榜</div><div class="rlist"></div>';
  r1.appendChild(c2);
  rankList(c2.querySelector('.rlist'), ps, [{k:'play',fmt:function(v){return v.play.toFixed(2)+'W'}},{k:'over5k',fmt:function(v){return v.over5k+'条'}}]);
  app.appendChild(r1);

  // Writers
  if(ws.length>0) {
    var r2 = document.createElement('div'); r2.className = 'row c2';
    var wc1 = document.createElement('div'); wc1.className = 'card';
    wc1.innerHTML = '<div class="h"><span class="dot" style="background:'+color+'"></span>文案 · 播放量对比</div><div class="chart-w"><canvas></canvas></div>';
    r2.appendChild(wc1);
    barChart(wc1.querySelector('canvas'), ws, 'play', '播放量（W）');

    var wc2 = document.createElement('div'); wc2.className = 'card';
    wc2.innerHTML = '<div class="h"><span class="dot" style="background:'+color+'"></span>文案 · 排行榜</div><div class="rlist"></div>';
    r2.appendChild(wc2);
    rankList(wc2.querySelector('.rlist'), ws, [{k:'play',fmt:function(v){return v.play.toFixed(2)+'W'}},{k:'pub',fmt:function(v){return v.pub+'条'}}]);
    app.appendChild(r2);
  }
}

buildSection(D.digital, '#4fc3f7', 'app');
buildSection(D.graphic, '#ffb74d', 'app');
</script>
</body>
</html>
