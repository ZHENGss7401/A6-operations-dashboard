<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6月运营看板 · A区</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --lime:#a3e635;--black:#000;--white:#fff;--graphite:#171717;--shadow:#0a0a0d;
  --steel:#737373;--iron:#222;--slate:#333;--fog:#f5f5f5;
  --butter:#fef3c8;--mint:#d2fae5;--lilac:#fae9ff;--pink:#f5d1fe;
  --sky:#b7eaf6;--cobalt:#3366e0;--meadow:#b9f0c0;
  --font:'Satoshi',ui-sans-serif,system-ui,-apple-system,sans-serif;
}
body{background:var(--white);color:var(--black);font-family:var(--font);font-weight:500;padding:40px 32px;max-width:1200px;margin:0 auto}
.header{margin-bottom:48px}
.header h1{font-size:32px;font-weight:700;letter-spacing:-0.32px;line-height:1.33}
.header .sub{font-size:14px;color:var(--steel);margin-top:8px;letter-spacing:-0.14px}
.section{margin-bottom:64px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.section-header .pill{display:inline-block;padding:6px 14px;border:1px solid var(--black);border-radius:100px;font-size:14px;font-weight:500;background:var(--white);box-shadow:2px 2px 0px 0px var(--shadow)}
.section-header h2{font-size:24px;font-weight:700;letter-spacing:-0.216px}
.stats{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.stat{border:1px solid var(--black);border-radius:8px;padding:14px 18px;min-width:120px;flex:1;box-shadow:2px 2px 0px 0px var(--shadow)}
.stat.blue{background:var(--sky)}
.stat.green{background:var(--meadow)}
.stat.yellow{background:var(--butter)}
.stat.purple{background:var(--lilac)}
.stat.pink{background:var(--pink)}
.stat .l{font-size:12px;color:var(--slate);margin-bottom:2px;font-weight:500;letter-spacing:-0.1px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-0.2px;line-height:1.3}
.stat .s{font-size:12px;color:var(--steel);margin-top:2px;font-weight:500}
.row{display:grid;gap:16px;margin-bottom:16px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.card{border:1px solid var(--black);border-radius:16px;padding:20px;background:var(--white);box-shadow:2px 2px 0px 0px var(--shadow)}
.card.pastel1{background:var(--butter)}
.card.pastel2{background:var(--mint)}
.card.pastel3{background:var(--lilac)}
.card.pastel4{background:var(--pink)}
.card .h{font-size:13px;color:var(--iron);margin-bottom:12px;font-weight:500;display:flex;align-items:center;gap:8px;letter-spacing:-0.1px}
.card .h .badge{display:inline-block;padding:2px 10px;border:1px solid var(--black);border-radius:100px;font-size:11px;background:var(--white)}
.chart-w{position:relative;height:200px}
.chart-w.t{height:260px}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;padding:8px 12px;border:1px solid var(--black);border-radius:12px;gap:8px;background:var(--white);box-shadow:1px 1px 0px 0px var(--shadow)}
.ritem .rn{width:24px;height:24px;border-radius:100px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--fog);color:var(--slate);border:1px solid var(--black);flex-shrink:0}
.ritem .rn.gold{background:#ffd700}
.ritem .rn.silver{background:#e8e8e8}
.ritem .rn.bronze{background:#e0b090}
.ritem .av{width:28px;height:28px;border-radius:100px;background:var(--lime);color:var(--black);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--black);flex-shrink:0}
.ritem .nm{flex:1;font-size:13px;font-weight:500;color:var(--black)}
.ritem .vl{font-size:14px;font-weight:700;color:var(--black)}
.ritem .vl2{font-size:11px;color:var(--steel);text-align:right;min-width:50px;font-weight:500}
.btn{padding:8px 20px;border:1px solid var(--black);border-radius:100px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;background:var(--lime);box-shadow:2px 2px 0px 0px var(--shadow);color:var(--black);display:inline-flex;align-items:center;gap:6px}
@media(max-width:768px){.c2,.c3{grid-template-columns:1fr}body{padding:20px 16px}}
</style>
</head>
<body>

<div class="header">
<h1>6月份运营累计播放量看板</h1>
<div class="sub">6月1日 — 6月11日 ｜ A 区</div>
</div>

<div id="app"></div>

<script>
var D = {"digital": {"label": "数字人视频", "persons": [["庄惜婷", {"play": 8.7, "pub": 305, "over5k": 3, "opct": 0.98, "us": 95.73}], ["王春燕", {"play": 4.1, "pub": 735, "over5k": 2, "opct": 0.27, "us": 96.1}]], "writers": [["刘信良", {"play": 12.2, "pub": 604, "over5k": 4, "opct": 0.66}], ["何嘉玲", {"play": 0.6, "pub": 425, "over5k": 1, "opct": 0.24}], ["林秋利", {"play": 0, "pub": 11, "over5k": 0, "opct": 0.0}]], "total_play": 12.8, "total_pub": 1040, "total_over5k": 5}, "graphic": {"label": "测评图文", "persons": [["吴丽贞", {"play": 26.4, "pub": 1596, "over5k": 20, "opct": 1.25, "us": 70.05}], ["蔡晓雪", {"play": 6.6, "pub": 1452, "over5k": 9, "opct": 0.62, "us": 37.13}], ["庄惜婷", {"play": 0.5, "pub": 904, "over5k": 1, "opct": 0.11, "us": 5.8}]], "writers": [["桂环", {"play": 33.5, "pub": 3952, "over5k": 30, "opct": 0.76}]], "total_play": 33.5, "total_pub": 3952, "total_over5k": 30}};
var CC = ['#a3e635','#3366e0','#fbbf25','#e57373','#ba68c8','#4db6ac','#f06292','#a1887f'];
var PASTELS = ['butter','mint','lilac','pink'];
var pi=0;
function nextPastel(){return PASTELS[pi++%4]}

function barChart(el, items, key, label) {
  var sorted = items.slice().sort(function(a,b){return b[1][key]-a[1][key]});
  new Chart(el, {
    type: 'bar',
    data: {labels: sorted.map(function(x){return x[0]}), datasets: [{data: sorted.map(function(x){return x[1][key]}), label: label, backgroundColor: CC, borderRadius: 4, barPercentage: 0.55}]},
    options: {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#333',font:{size:11,family:'Satoshi',weight:'500'}},grid:{display:false}},y:{ticks:{color:'#737373',font:{size:11,family:'Satoshi',weight:'500'}},grid:{color:'#eee'}}}}
  });
}

function rankList(el, items, fields) {
  var h = '';
  for(var i=0;i<items.length;i++) {
    var rc='rn'+(i===0?' gold':i===1?' silver':i===2?' bronze':'');
    h += '<div class="ritem"><div class="'+rc+'">'+(i+1)+'</div><div class="av">'+items[i][0].charAt(0)+'</div><div class="nm">'+items[i][0]+'</div>';
    for(var f=0;f<fields.length;f++) {
      var v = fields[f].fmt ? fields[f].fmt(items[i][1]) : items[i][1][fields[f].k];
      h += '<div class="'+(f===0?'vl':'vl2')+'">'+v+'</div>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

function b(id, items, key, label){barChart(document.getElementById(id),items,key,label)}

function buildSection(sec, containerId) {
  var app = document.getElementById(containerId);
  var ps = sec.persons, ws = sec.writers;
  var tp=sec.total_play, tpub=sec.total_pub, tov=sec.total_over5k;
  var tpc = tpub>0?(tov/tpub*100).toFixed(2):'0.00';

  var h = '<div class="section">';
  h += '<div class="section-header"><span class="pill">'+(sec.label==='数字人视频'?'🎬':'📝')+'</span><h2>'+sec.label+'</h2></div>';

  var statColors = [nextPastel(), nextPastel(), nextPastel(), nextPastel(), nextPastel()];
  h += '<div class="stats">';
  h += '<div class="stat '+statColors[0]+'"><div class="l">月累计播放量</div><div class="v">'+tp.toFixed(2)+'W</div><div class="s">总播放量</div></div>';
  h += '<div class="stat '+statColors[1]+'"><div class="l">发布条数</div><div class="v">'+tpub.toLocaleString()+'</div><div class="s">破0起计</div></div>';
  h += '<div class="stat '+statColors[2]+'"><div class="l">上5K条数</div><div class="v">'+tov+'</div><div class="s">爆款数量</div></div>';
  h += '<div class="stat '+statColors[3]+'"><div class="l">上5K占比</div><div class="v">'+tpc+'%</div><div class="s">爆款率</div></div>';
  h += '<div class="stat '+statColors[4]+'"><div class="l">运营人数</div><div class="v">'+ps.length+'</div><div class="s">当前人员</div></div>';
  h += '</div>';

  // Person chart + rank
  h += '<div class="row c2">';
  h += '<div class="card"><div class="h"><span class="badge">运营</span>播放量对比</div><div class="chart-w t"><canvas id="pc_'+sec.label+'"></canvas></div></div>';
  h += '<div class="card pastel'+(pi%4+1)+'"><div class="h"><span class="badge">运营</span>播放量排行榜</div><div class="rlist" id="pr_'+sec.label+'"></div></div>';
  h += '</div>';

  // Writers
  if(ws.length>0) {
    h += '<div class="row c2">';
    h += '<div class="card"><div class="h"><span class="badge">文案</span>播放量对比</div><div class="chart-w"><canvas id="wc_'+sec.label+'"></canvas></div></div>';
    h += '<div class="card pastel'+(pi%4+1)+'"><div class="h"><span class="badge">文案</span>排行榜</div><div class="rlist" id="wr_'+sec.label+'"></div></div>';
    h += '</div>';
  }

  h += '</div>';
  document.getElementById(containerId).insertAdjacentHTML('beforeend', h);

  // Render
  b('pc_'+sec.label, ps, 'play', '播放量（W）');
  rankList(document.getElementById('pr_'+sec.label), ps, [{k:'play',fmt:function(v){return v.play.toFixed(2)+'W'}},{k:'over5k',fmt:function(v){return v.over5k+'条'}}]);

  if(ws.length>0) {
    b('wc_'+sec.label, ws, 'play', '播放量（W）');
    rankList(document.getElementById('wr_'+sec.label), ws, [{k:'play',fmt:function(v){return v.play.toFixed(2)+'W'}},{k:'pub',fmt:function(v){return v.pub+'条'}}]);
  }
}

buildSection(D.digital, 'app');
buildSection(D.graphic, 'app');
</script>
</body>
</html>
